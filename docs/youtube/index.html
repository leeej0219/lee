    }
    case 3: if (wiz.yt) return `<div class="empty"><b>▶ YouTube에서 자동으로 채워져요</b>조회수·좋아요·댓글·구독자·유입 경로·검색어는 YouTube 새로고침 때마다 업데이트돼요.</div>`;
      return `${inp('statDate', '기록 날짜', 'type="date"')}
      <p class="muted small" style="margin:-8px 0 12px">YouTube 스튜디오에서 본 <b>지금까지의 누적</b> 숫자를 적어 주세요. 이후엔 상세 페이지의 "오늘 성과 기록"으로 계속 쌓을 수 있어요.</p>
      <div class="row4">${inp('views', '조회수', 'type="number" min="0" inputmode="numeric"')}${inp('likes', '좋아요', 'type="number" min="0" inputmode="numeric"')}${inp('comments', '댓글', 'type="number" min="0" inputmode="numeric"')}${inp('subs', '구독자 증가', 'type="number" inputmode="numeric"')}</div>
      <details class="more" ${sum(Object.values(f.traffic)) ? 'open' : ''}><summary>유입 경로 (선택)</summary>
        <p class="muted small" style="margin-top:0">스튜디오 > 분석 > 콘텐츠 > 트래픽 소스의 조회수</p>
        <div class="row2">${SOURCES.map(s => `<div class="fld" style="margin-bottom:8px"><label>${s}</label><input class="inp" type="number" min="0" data-tr="${esc(s)}" value="${esc(f.traffic[s] ?? '')}"></div>`).join('')}</div></details>
      <details class="more" ${f.keywords.length ? 'open' : ''}><summary>검색어 (선택)</summary>
        <div class="kw-rows">${f.keywords.map((k, i) => `<div class="r"><input class="inp" data-kwk="${i}" value="${esc(k.keyword)}" placeholder="검색어" aria-label="검색어"><input class="inp" type="number" min="0" data-kwv="${i}" value="${esc(k.views)}" placeholder="조회수" aria-label="조회수"><button type="button" class="btn ghost sm" data-w="rmkw" data-i="${i}" aria-label="삭제">✕</button></div>`).join('')}</div>
        <button type="button" class="btn sm" data-w="addkw" style="margin-top:8px">＋ 검색어 추가</button></details>`;
    case 4: return `<div class="sec-t">제작 전</div>
      ${ta('reason', '왜 이 콘텐츠를 만들었나?')}
      <div class="row2">${li('target', '누가 볼 것이라고 생각했나?')}${li('hook', '첫 3초 후킹')}</div>
      <div class="row2">${li('format', '콘텐츠 포맷', 'placeholder="예: 스토리텔링"')}${li('expected', '기대한 반응')}</div>
      <details class="more"><summary>제작 정보 (선택)</summary>
        <div class="row2">${li('planDate', '기획일', 'type="date"')}${li('shootDate', '촬영일', 'type="date"')}${li('editDate', '편집일', 'type="date"')}${li('hours', '제작 소요시간(시간)', 'type="number" min="0" step="0.5"')}</div>
        ${li('tools', '사용 프로그램', 'placeholder="예: CapCut, Premiere Pro"')}</details>
      <div class="sec-t">업로드 후 회고</div>
      ${ta('good', '잘된 점')}${ta('bad', '아쉬운 점')}${ta('reaction', '댓글 반응 / 발견한 인사이트')}${ta('change', '다음에 바꿀 점')}${ta('nextIdea', '다음 콘텐츠 아이디어')}`;
  }
}
function drawWizard() {
  const last = wiz.step === WSTEPS.length - 1;
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="wizT">
    <div class="modal-h"><h2 id="wizT">${wiz.id ? '콘텐츠 수정' : '콘텐츠 추가'}</h2><button class="btn ghost sm" data-w="close" aria-label="닫기">✕</button></div>
    <div class="steps" aria-hidden="true">${WSTEPS.map((_, i) => `<span class="${i <= wiz.step ? 'on' : ''}"></span>`).join('')}</div>
    <div class="step-t">Step ${wiz.step + 1} / ${WSTEPS.length} · ${WSTEPS[wiz.step]}</div>
    <form class="modal-b" id="wizF" novalidate>${wizBody()}</form>
    <div class="modal-f">${wiz.step ? `<button class="btn" data-w="prev">이전</button>` : ''}<span class="sp"></span>
      ${!last ? `<button class="btn ghost" data-w="save">바로 저장</button><button class="btn primary" data-w="next">다음</button>` : `<button class="btn primary" data-w="save">저장하기</button>`}</div>
  </div></div>`;
  const first = $('#wizF input, #wizF textarea'); if (first) first.focus();
  const tagIn = $('#w_tag'); if (tagIn) tagIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addTag(); } });
  $('#wizF').addEventListener('submit', e => e.preventDefault());
}
function collect() {
  const f = wiz.f;
  $$('#wizF [data-f]').forEach(el => { f[el.dataset.f] = el.value; });
  $$('#wizF [data-l]').forEach(el => { f.log[el.dataset.l] = el.value; });
  const fm = $('input[name="w_format"]:checked'); if (fm) f.format = fm.value;
  const ty = $('input[name="w_type"]:checked'); if (ty) f.type = ty.value;
  $$('#wizF [data-tr]').forEach(el => { if (el.value === '') delete f.traffic[el.dataset.tr]; else f.traffic[el.dataset.tr] = +el.value; });
  $$('#wizF [data-kwk]').forEach(el => { f.keywords[+el.dataset.kwk].keyword = el.value; });
  $$('#wizF [data-kwv]').forEach(el => { f.keywords[+el.dataset.kwv].views = +el.value || 0; });
}
function addTag() {
  collect();
  const el = $('#w_tag'); const v = el.value.replace(/^#/, '').trim();
  if (v) v.split(/[,\s]*#|,/).map(s => s.trim()).filter(Boolean).forEach(t => { if (!wiz.f.tags.includes(t)) wiz.f.tags.push(t); });
  drawWizard(); $('#w_tag').focus();
}
function wizValid() {
  const f = wiz.f;
  if (!f.title.trim()) { wiz.step = 0; drawWizard(); toast('콘텐츠 제목을 입력해 주세요'); $('#w_title').focus(); return false; }
  if (!f.uploadDate) { wiz.step = 0; drawWizard(); toast('업로드 날짜를 입력해 주세요'); return false; }
  return true;
}
function saveWizard() {
  collect(); if (!wizValid()) return;
  const f = wiz.f;
  let c = wiz.id ? DB.contents.find(x => x.id === wiz.id) : null;
  if (!c) { c = { id: uid(), stats: [], createdAt: Date.now() }; DB.contents.push(c); }
  if (c.ytId && f.format !== c.format) c.formatLocked = true;
  c.editedAt = Date.now();
  Object.assign(c, { title: f.title.trim(), url: f.url.trim(), thumbnail: f.thumbnail.trim(), uploadDate: f.uploadDate, uploadTime: f.uploadTime, series: f.series.trim(), description: f.description,
    format: f.format, type: f.type, tags: f.tags, traffic: f.traffic, keywords: f.keywords.filter(k => String(k.keyword).trim()), log: f.log });
  const hasStat = !c.ytId && ['views', 'likes', 'comments', 'subs'].some(k => f[k] !== '' && f[k] != null);
  if (hasStat) {
    const date = f.statDate || ds(todayN());
    c.stats = c.stats.filter(s => s.date !== date && s.date !== f.origStatDate);
    c.stats.push({ date, views: +f.views || 0, likes: +f.likes || 0, comments: +f.comments || 0, subs: +f.subs || 0 });
  }
  bust(c); save(); closeModal();
  toast(wiz && wiz.id ? '수정했어요' : '콘텐츠를 추가했어요');
  location.hash = '#/content/' + c.id; render();
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

/* ---------- 오늘 성과 기록 (스냅샷 추가) ---------- */
function openSnapshot(id) {
  const c = DB.contents.find(x => x.id === id); if (!c) return;
  const lt = total(c);
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="snT" style="width:min(520px,100%)">
    <div class="modal-h"><h2 id="snT">성과 기록 추가</h2><button class="btn ghost sm" data-w="close" aria-label="닫기">✕</button></div>
    <form class="modal-b" id="snF">
      <p class="muted" style="margin-top:0">${esc(c.title)} — 스튜디오에서 본 <b>누적</b> 숫자를 적어 주세요. 날짜마다 쌓여서 성장 곡선이 돼요.</p>
      <div class="fld"><label for="sn_d">기록 날짜</label><input class="inp" type="date" id="sn_d" value="${ds(todayN())}" required></div>
      <div class="row2">
        <div class="fld"><label for="sn_v">조회수</label><input class="inp" type="number" min="0" id="sn_v" placeholder="이전 ${fmt(lt.views)}"></div>
        <div class="fld"><label for="sn_l">좋아요</label><input class="inp" type="number" min="0" id="sn_l" placeholder="이전 ${fmt(lt.likes)}"></div>
        <div class="fld"><label for="sn_c">댓글</label><input class="inp" type="number" min="0" id="sn_c" placeholder="이전 ${fmt(lt.comments)}"></div>
        <div class="fld"><label for="sn_s">구독자 증가</label><input class="inp" type="number" id="sn_s" placeholder="이전 ${fmt(lt.subs)}"></div>
      </div>
      <p class="muted small">비워 둔 칸은 이전 기록 값을 그대로 써요.</p>
    </form>
    <div class="modal-f"><span class="sp"></span><button class="btn" data-w="close">취소</button><button class="btn primary" data-w="snsave" data-id="${esc(c.id)}">기록하기</button></div>
  </div></div>`;
  $('#sn_v').focus();
}
function saveSnapshot(id) {
  const c = DB.contents.find(x => x.id === id); if (!c) return;
  const date = $('#sn_d').value; if (!date) { toast('날짜를 입력해 주세요'); return; }
  if (dn(date) < dn(c.uploadDate)) { toast('업로드 날짜 이후로 입력해 주세요'); return; }
  const prev = { views: cumAt(c, 'views', dn(date)), likes: cumAt(c, 'likes', dn(date)), comments: cumAt(c, 'comments', dn(date)), subs: cumAt(c, 'subs', dn(date)) };
  const v = (sel, k) => $(sel).value === '' ? Math.round(prev[k]) : +$(sel).value;
  c.stats = c.stats.filter(s => s.date !== date);
  c.stats.push({ date, views: v('#sn_v', 'views'), likes: v('#sn_l', 'likes'), comments: v('#sn_c', 'comments'), subs: v('#sn_s', 'subs') });
  c.editedAt = Date.now(); bust(c); save(); closeModal(); toast('기록했어요'); render();
}

/* ---------- 검색어 → 관련 콘텐츠 ---------- */
function openKeyword(kw) {
  const list = DB.contents.map(c => ({ c, k: (c.keywords || []).find(k => String(k.keyword).trim() === kw) })).filter(x => x.k).sort((a, b) => b.k.views - a.k.views);
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="kwT" style="width:min(520px,100%)">
    <div class="modal-h"><h2 id="kwT">"${esc(kw)}" 검색으로 들어온 콘텐츠</h2><button class="btn ghost sm" data-w="close" aria-label="닫기">✕</button></div>
    <div class="modal-b"><div class="recent">${list.map(x => `<a href="#/content/${esc(x.c.id)}" data-w="close">${thumbHTML(x.c)}<div><b>${esc(x.c.title)}</b><div class="meta">${fmtBadge(x.c)} ${ymd(dn(x.c.uploadDate))}</div><div class="nums"><span>이 검색어로 ${fmt(x.k.views)}회</span></div></div></a>`).join('') || '<div class="empty small">없음</div>'}</div></div>
  </div></div>`;
}

/* =========================================================
   이벤트 위임
   ========================================================= */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go && !e.target.closest('a')) { location.hash = go.dataset.go; return; }
  const kw = e.target.closest('[data-kw]'); if (kw) { openKeyword(kw.dataset.kw); return; }
  const w = e.target.closest('[data-w]');
  if (w) {
    const a = w.dataset.w;
    if (a === 'close') { if (w.tagName !== 'A') e.preventDefault(); closeModal(); return; }
    if (a === 'snsave') { saveSnapshot(w.dataset.id); return; }
    if (!wiz) return;
    if (a === 'next') { collect(); if (wiz.step === 0 && !wizValid()) return; wiz.step++; drawWizard(); }
    else if (a === 'prev') { collect(); wiz.step--; drawWizard(); }
    else if (a === 'save') saveWizard();
    else if (a === 'addtag') addTag();
    else if (a === 'rmtag') { collect(); wiz.f.tags.splice(+w.dataset.i, 1); drawWizard(); }
    else if (a === 'sugg') { collect(); wiz.f.tags.push(w.dataset.t); drawWizard(); }
    else if (a === 'addkw') { collect(); wiz.f.keywords.push({ keyword: '', views: '' }); drawWizard(); const k = $$('[data-kwk]').pop(); if (k) k.focus(); }
    else if (a === 'rmkw') { collect(); wiz.f.keywords.splice(+w.dataset.i, 1); drawWizard(); }
    return;
  }
  const act = e.target.closest('[data-act]'); if (!act) return;
  const a = act.dataset.act;
  if (a === 'add') openWizard(null);
  else if (a === 'edit') { openWizard(act.dataset.id, +(act.dataset.step || 0)); const f = act.dataset.focus && $('#wl_' + act.dataset.focus); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  else if (a === 'snapshot') openSnapshot(act.dataset.id);
  else if (a === 'delete') {
    const c = DB.contents.find(x => x.id === act.dataset.id);
    if (c && confirm(`"${c.title}" 콘텐츠와 모든 기록을 삭제할까요?`)) { DB.contents = DB.contents.filter(x => x !== c); DB.deleted = (DB.deleted || []).concat(c.id); save(); toast('삭제했어요'); location.hash = '#/contents'; }
  } else if (a === 'del-stat') {
    const c = DB.contents.find(x => x.id === act.dataset.id);
    if (c && confirm(`${act.dataset.date} 기록을 삭제할까요?`)) { c.stats = c.stats.filter(s => s.date !== act.dataset.date); c.editedAt = Date.now(); bust(c); save(); render(); }
  } else if (a === 'del-sub') {
    if (confirm(`${act.dataset.date} 구독자 기록을 삭제할까요?`)) { DB.subscriberHistory = DB.subscriberHistory.filter(h => h.date !== act.dataset.date); save(); render(); }
  } else if (a === 'clear-sample') {
    if (confirm('예시 데이터를 모두 지우고 빈 상태로 시작할까요?')) { DB = { isSample: false, channel: DB.channel, subscriberHistory: [], contents: [] }; _pc.clear(); save(); toast('깨끗하게 비웠어요. 첫 콘텐츠를 추가해 보세요!'); location.hash = '#/home'; render(); }
  } else if (a === 'load-sample') {
    if (!DB.contents.length || confirm('지금 데이터를 예시 데이터로 바꿀까요? (먼저 백업을 권해요)')) { DB = makeSample(); _pc.clear(); save(); render(); }
  } else if (a === 'reset') {
    if (confirm('정말 모든 데이터를 삭제할까요? 되돌릴 수 없어요.')) { DB = { isSample: false, channel: { name: '그냥 은지', owner: '은지', url: '' }, subscriberHistory: [], contents: [] }; _pc.clear(); save(); render(); }
  } else if (a === 'save-idea') {
    toast(addIdea(act.dataset.idea) ? '아이디어 보관함에 담았어요' : '이미 담긴 아이디어예요'); render();
  } else if (a === 'idea-done') {
    const it = (DB.ideas || []).find(i => i.id === act.dataset.id); if (it) { it.done = !it.done; it.updatedAt = Date.now(); save(); render(); }
  } else if (a === 'idea-del') {
    const it = (DB.ideas || []).find(i => i.id === act.dataset.id); if (it) { it.deleted = true; it.updatedAt = Date.now(); save(); render(); }
  } else if (a === 'sync') {
    runSync();
  } else if (a === 'yt-off') {
    if (confirm('YouTube 연결을 해제할까요? 불러온 데이터는 남아 있고, 자동 새로고침만 멈춰요.')) {
      if (ytToken && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(ytToken.access_token, () => {});
      ytToken = null; try { localStorage.removeItem(KEY + ':tok'); } catch (e) {}
      DB.yt = null; DB.channelDaily = []; DB.contents.forEach(c => { if (c.ytId) { delete c.ytId; } }); _pc.clear(); save(); render();
    }
  } else if (a === 'export') {
    const clean = JSON.parse(JSON.stringify(DB, (k, v) => k === '_v' ? undefined : v));
    const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const link = document.createElement('a');
    link.href = url; link.download = `그냥은지-대시보드-백업-${ds(todayN())}.json`; document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#mbg')) closeModal(); });
document.addEventListener('mousedown', e => { if (e.target.id === 'mbg') closeModal(); });

/* =========================================================
   라우팅 / 렌더
   ========================================================= */
const ui = { homeTab: '전체', homeSort: 'views', cFmt: '전체', cType: '', cSort: 'recent', cq: '', dMetric: 'views', logFilter: 'all' };
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const [path, qs] = h.split('?');
  const parts = path.split('/');
  return { name: parts[0] || 'home', arg: decodeURIComponent(parts[1] || ''), q: new URLSearchParams(qs || '') };
}
let lastRoute = '';
function render() {
  const r = parseHash();
  const main = $('#main');
  $('#brandName').textContent = DB.channel.name || '그냥 은지';
  document.title = `${DB.channel.name || '그냥 은지'} 대시보드`;
  const navKey = r.name === 'content' ? 'contents' : r.name;
  $$('#nav a').forEach(a => { if (a.dataset.r === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const routeKey = location.hash;
  const scroll = routeKey === lastRoute ? scrollY : 0;
  hideTip();
  switch (r.name) {
    case 'analytics': main.innerHTML = pageAnalytics(); afterAnalytics(); break;
    case 'recommend': main.innerHTML = pageRecommend(); afterRecommend(); break;
    case 'contents': main.innerHTML = pageContents(r.q); afterContents(); break;
    case 'content': main.innerHTML = pageDetail(r.arg); afterDetail(r.arg); break;
    case 'subscribers': main.innerHTML = pageSubscribers(); afterSubscribers(); break;
    case 'traffic': main.innerHTML = pageTraffic(); bindPeriod(); break;
    case 'log': main.innerHTML = pageLog(); $$('[data-lf]').forEach(b => b.addEventListener('click', () => { ui.logFilter = b.dataset.lf; render(); })); break;
    case 'settings': main.innerHTML = pageSettings(); afterSettings(); break;
    default: main.innerHTML = pageHome(); afterHome(); bindPeriod();
  }
  if (routeKey !== lastRoute) window.scrollTo(0, 0); else window.scrollTo(0, scroll);
  lastRoute = routeKey;
}
function applyTheme() {
  let th = 'auto'; try { th = localStorage.getItem(KEY + ':theme') || 'auto'; } catch (e) {}
  if (th === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
}
let rzT; let lastW = innerWidth;
addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rzT); rzT = setTimeout(render, 150); });
addEventListener('hashchange', render);

DB = load();
applyTheme();
if (DB.isSample && !localStorage.getItem(KEY)) saveLocal();
if (clientId()) loadGIS().catch(() => {});
cloudAutoPull();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cloudAutoPull(); });
render();
</script>
</body>
