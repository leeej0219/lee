<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그냥 은지 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f6f6fa;
    --surface: #ffffff;
    --surface-2: #f3f2f9;
    --ink: #1c1b25;
    --ink-2: #5b5a6b;
    --ink-3: #8f8ea0;
    --line: #e7e6ef;
    --grid: #eeedf3;
    --accent: #6a5ae0;
    --accent-soft: #eeebfd;
    --accent-ink: #ffffff;
    --soft-blue: #e8f0fc;
    --views: #2a78d6;
    --likes: #d55181;
    --comments: #6a5ae0;
    --subs: #1a9e70;
    --up: #13875f;
    --down: #c4452f;
    --danger: #c4452f;
    --danger-soft: #fbe9e5;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7;
    --shadow: 0 1px 2px rgb(30 28 60 / 4%), 0 4px 16px rgb(30 28 60 / 5%);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15141b; --surface: #1e1d26; --surface-2: #262532;
      --ink: #f1f0f7; --ink-2: #b4b2c4; --ink-3: #7d7b8f;
      --line: #302f3c; --grid: #2a2935;
      --accent: #9d91f5; --accent-soft: #2c2945; --accent-ink: #15141b;
      --soft-blue: #1f2a3c;
      --views: #3987e5; --likes: #e0709a; --comments: #9d91f5; --subs: #2cb584;
      --up: #3cc28f; --down: #ef7e67; --danger: #ef7e67; --danger-soft: #3a2320;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9;
      --shadow: 0 1px 2px rgb(0 0 0 / 30%);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15141b; --surface: #1e1d26; --surface-2: #262532;
    --ink: #f1f0f7; --ink-2: #b4b2c4; --ink-3: #7d7b8f;
    --line: #302f3c; --grid: #2a2935;
    --accent: #9d91f5; --accent-soft: #2c2945; --accent-ink: #15141b;
    --soft-blue: #1f2a3c;
    --views: #3987e5; --likes: #e0709a; --comments: #9d91f5; --subs: #2cb584;
    --up: #3cc28f; --down: #ef7e67; --danger: #ef7e67; --danger-soft: #3a2320;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side-wrap { background: var(--surface); border-right: 1px solid var(--line); min-width: 0; }
  .side {
    position: sticky; top: 0; height: 100vh;
    padding: 22px 14px; display: flex; flex-direction: column; gap: 22px;
  }
  .brand { padding: 0 10px; text-decoration: none; display: block; }
  .brand b { display: block; font-size: 18px; letter-spacing: -0.02em; }
  .brand span { font-size: 12px; color: var(--ink-3); }
  .brand .mark {
    display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; margin-bottom: 10px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px;
    text-decoration: none; color: var(--ink-2); font-weight: 500;
  }
  .nav a .ic { width: 22px; text-align: center; font-size: 16px; }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .side-foot { margin-top: auto; padding: 0 10px; font-size: 12px; color: var(--ink-3); }

  .main { min-width: 0; padding: 26px 32px 60px; max-width: 1360px; width: 100%; }
  .topbar { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .topbar h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .topbar p { margin: 2px 0 0; color: var(--ink-2); }
  .topbar .grow { flex: 1; min-width: 200px; }
  .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  @media (max-width: 1099px) and (min-width: 721px) {
    .app { grid-template-columns: 72px 1fr; }
    .side { padding: 22px 10px; align-items: center; }
    .brand b, .brand span, .nav a .lb, .side-foot { display: none; }
    .brand { padding: 0; }
    .brand .mark { margin: 0; }
    .nav a { padding: 10px; justify-content: center; }
    .main { padding: 24px 22px 60px; }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .side-wrap { position: sticky; top: 0; z-index: 20; border-right: 0; border-bottom: 1px solid var(--line); }
    .side {
      position: static; height: auto; flex-direction: row; align-items: center;
      padding: 10px 16px; gap: 12px;
      overflow-x: auto; scrollbar-width: none;
    }
    .side::-webkit-scrollbar { display: none; }
    .brand { padding: 0; flex: none; }
    .brand .mark { margin: 0; }
    .brand b, .brand span, .side-foot { display: none; }
    .nav { flex-direction: row; gap: 4px; }
    .nav a { padding: 7px 11px; white-space: nowrap; gap: 6px; font-size: 13px; }
    .nav a .ic { width: auto; font-size: 14px; }
    .main { padding: 18px 16px 60px; }
    .topbar h1 { font-size: 21px; }
  }

  /* ---------- controls ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer;
    font-weight: 500; text-decoration: none; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  select.sel, input.inp, textarea.inp {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px;
  }
  select.sel { padding-right: 30px; appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  input.inp, textarea.inp { width: 100%; }
  textarea.inp { min-height: 76px; resize: vertical; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filters .custom { display: flex; gap: 6px; align-items: center; }
  .filters .custom input { width: 140px; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card-h .sub { color: var(--ink-3); font-size: 12.5px; }
  .card-h .sp { flex: 1; }
  .grid { display: grid; gap: 16px; margin-bottom: 16px; }
  .g-kpi { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }
  .g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .g-11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-111 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1099px) { .g-21, .g-111 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 720px) { .g-11 { grid-template-columns: minmax(0, 1fr); } .card { padding: 16px; } }

  .kpi { display: flex; flex-direction: column; gap: 2px; }
  .kpi .lbl { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .kpi .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .kpi .val { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; order: -1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
  .delta .up { color: var(--up); font-weight: 600; }
  .delta .down { color: var(--down); font-weight: 600; }

  .banner {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--soft-blue);
    border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; color: var(--ink);
  }
  .banner p { margin: 0; flex: 1; min-width: 220px; }

  .insights { display: flex; flex-direction: column; gap: 10px; }
  .insight { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .rec { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .rec .lv { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
  .rec h3 { margin: 0; font-size: 16px; line-height: 1.35; }
  .rec ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
  .rec ul b { color: var(--ink); }
  .rec .btn { margin-top: auto; }
  .insight .lv { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; flex: none; margin-top: 1px; }
  .insight p { margin: 0; }
  .insight b { font-weight: 700; }

  /* ---------- charts ---------- */
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart .axis text { fill: var(--ink-3); font-size: 11px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .cross { stroke: var(--ink-3); stroke-width: 1; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

  .tip {
    position: fixed; z-index: 100; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; box-shadow: 0 6px 24px rgb(20 18 40 / 16%); font-size: 12.5px; min-width: 130px;
    opacity: 0; transition: opacity .1s;
  }
  .tip.on { opacity: 1; }
  .tip .t { color: var(--ink-2); margin-bottom: 4px; font-weight: 600; }
  .tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tip .r span { color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .tip .r span i { width: 10px; height: 2px; border-radius: 2px; display: inline-block; }
  .tip .r b { font-variant-numeric: tabular-nums; }

  .donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .donut-wrap svg { width: 150px; height: 150px; flex: none; }
  .donut-wrap .seg-arc { cursor: pointer; transition: opacity .12s; }
  .donut-wrap .seg-arc:hover { opacity: .8; }
  .donut-legend { flex: 1; min-width: 170px; display: flex; flex-direction: column; gap: 5px; }
  .donut-legend button { all: unset; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
  .donut-legend button:hover { background: var(--surface-2); }
  .donut-legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .donut-legend .nm { flex: 1; color: var(--ink-2); }
  .donut-legend .pc { font-weight: 600; font-variant-numeric: tabular-nums; }

  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: minmax(70px, 150px) 1fr; gap: 10px; align-items: center; }
  .bar-row .nm { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
  .bar-track .v { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-row:hover .bar { filter: brightness(1.1); }

  .kw { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .kw li button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 12px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
  .kw li button:hover { background: var(--surface-2); }
  .kw .rk { width: 20px; color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
  .kw .kn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kw .kv { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* ---------- tables & lists ---------- */
  .tbl-wrap { overflow-x: auto; margin: 0 -4px; }
  table.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tbl th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--ink-3); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .num { text-align: right; }
  .tbl tbody tr.link { cursor: pointer; }
  .tbl tbody tr.link:hover td { background: var(--surface-2); }
  .tbl .ttl { display: flex; align-items: center; gap: 12px; white-space: normal; min-width: 220px; }
  .tbl .ttl b { font-weight: 600; display: block; }
  .tbl .ttl small { color: var(--ink-3); }

  .thumb {
    width: 64px; aspect-ratio: 16/9; border-radius: 8px; flex: none; object-fit: cover; overflow: hidden;
    display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 13px; background: var(--surface-2);
  }
  .d-head a:has(.thumb) { text-decoration: none; }
  .thumb.lg { width: 100%; max-width: 420px; border-radius: 14px; font-size: 28px; }
  .thumb.md { width: 100%; border-radius: 10px; font-size: 20px; }
  .badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
  .badge.shorts { background: #fde8ef; color: #a3305c; }
  .badge.long { background: var(--soft-blue); color: #1d5aa3; }
  :root[data-theme="dark"] .badge.shorts { background: #3a2230; color: #f0a5c2; }
  :root[data-theme="dark"] .badge.long { color: #8dbcf2; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge.shorts { background: #3a2230; color: #f0a5c2; }
    :root:not([data-theme="light"]) .badge.long { color: #8dbcf2; }
  }
  .tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); margin: 0 4px 4px 0; }

  .m-list { display: none; flex-direction: column; gap: 10px; }
  .m-item { display: flex; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-decoration: none; }
  .m-item .thumb { width: 96px; }
  .m-item b { display: block; font-weight: 600; line-height: 1.35; }
  .m-item .meta { font-size: 12px; color: var(--ink-3); }
  .m-item .nums { display: flex; gap: 10px; font-size: 12.5px; color: var(--ink-2); margin-top: 4px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) { .tbl-wrap.resp { display: none; } .m-list { display: flex; } }

  .recent { display: flex; flex-direction: column; }
  .recent a { display: flex; gap: 12px; padding: 10px 4px; text-decoration: none; border-bottom: 1px solid var(--line); border-radius: 8px; }
  .recent a:last-child { border-bottom: 0; }
  .recent a:hover { background: var(--surface-2); }
  .recent .thumb { width: 88px; }
  .recent b { display: block; font-weight: 600; line-height: 1.35; }
  .recent .meta { font-size: 12px; color: var(--ink-3); }
  .recent .nums { display: flex; gap: 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; }

  .c-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .c-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; padding: 12px; }
  .c-card:hover { border-color: var(--accent); }
  .c-card b { font-weight: 600; line-height: 1.35; }
  .c-card .meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
  .c-card .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 12px; color: var(--ink-3); }
  .c-card .nums b { display: block; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }

  .empty { text-align: center; color: var(--ink-3); padding: 40px 16px; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
  .muted { color: var(--ink-3); }
  .small { font-size: 12.5px; }

  /* ---------- detail ---------- */
  .back { display: inline-flex; gap: 6px; color: var(--ink-2); text-decoration: none; margin-bottom: 14px; }
  .back:hover { color: var(--ink); }
  .d-head { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .d-head { grid-template-columns: 1fr; } }
  .d-head h1 { margin: 6px 0 8px; font-size: 26px; letter-spacing: -0.02em; line-height: 1.25; }
  .d-meta { color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .d-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  @media (max-width: 560px) { .d-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .d-stats .kpi .val { font-size: 24px; }
  .cmp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 720px) { .cmp { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cmp div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .cmp span { color: var(--ink-2); font-size: 12.5px; display: block; }
  .cmp b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .cmp small { display: block; color: var(--ink-3); font-size: 11.5px; }
  .qa { display: grid; gap: 14px; }
  .qa dt { font-size: 12.5px; color: var(--ink-3); margin-bottom: 2px; }
  .qa dd { margin: 0; white-space: pre-wrap; }
  .qa dd.none { color: var(--ink-3); font-style: italic; }

  /* ---------- log ---------- */
  .log-item { display: grid; grid-template-columns: 120px 1fr; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .log-item:last-child { border-bottom: 0; }
  @media (max-width: 720px) { .log-item { grid-template-columns: 1fr; gap: 10px; } }
  .log-item h3 { margin: 0 0 4px; font-size: 16px; }
  .log-item h3 a { text-decoration: none; }
  .log-item h3 a:hover { text-decoration: underline; }
  .log-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
  .log-cols div { background: var(--surface-2); padding: 10px 12px; border-radius: 10px; }
  .log-cols span { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }

<script>
'use strict';
/* =========================================================
   유틸
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 864e5;
const dn = s => { const [y, m, d] = String(s).split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };

const todayN = () => { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY); };
const fmt = n => Math.round(n || 0).toLocaleString('ko-KR');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const compact = n => {
  const a = Math.abs(n || 0);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return fmt(n);
};
const pct = (a, b, d = 1) => b ? (a / b * 100).toFixed(d) + '%' : '—';
const md = n => { const d = new Date(n * DAY); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const ymd = n => { const d = new Date(n * DAY); return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}`; };
const kday = n => { const d = new Date(n * DAY); return `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const avg = (arr, f = x => x) => arr.length ? sum(arr, f) / arr.length : 0;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}

const FORMATS = ['Shorts', '롱폼'];
const TYPES = ['브이로그', '정보형', '리액션', '팬콘텐츠', '인터뷰', '기타'];
const SOURCES = ['Shorts 피드', 'YouTube 검색', '추천 동영상', '탐색 기능', '채널 페이지', '외부', '기타'];
const SOURCE_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)'];
const METRICS = {
  views: { label: '조회수', color: 'var(--views)' },
  likes: { label: '좋아요', color: 'var(--likes)' },
  comments: { label: '댓글', color: 'var(--comments)' },
  subs: { label: '구독자', color: 'var(--subs)' },
};

/* =========================================================
   저장소 (localStorage)
   ========================================================= */
const KEY = 'justeunji-yt-dashboard-v1';
let DB = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.contents)) return normalize(d); }
  } catch (e) { console.error(e); }
  return makeSample();
}
function normalize(d) {
  d.channel = Object.assign({ name: '그냥 은지', owner: '은지', url: '' }, d.channel || {});
  d.subscriberHistory = d.subscriberHistory || [];
  d.channelDaily = d.channelDaily || [];
  d.yt = d.yt || null;
  d.ideas = d.ideas || [];
  d.contents.forEach(c => {
    c.tags = c.tags || []; c.stats = c.stats || []; c.traffic = c.traffic || {};
    c.keywords = c.keywords || []; c.log = c.log || {};
  });
  return d;
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { console.error(e); toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.'); }
}
function save() { DB.updatedAt = Date.now(); saveLocal(); if (typeof scheduleCloudPush === 'function') scheduleCloudPush(); }

/* =========================================================
   YouTube 연동 (브라우저에서 구글 로그인 → Data API + Analytics API)
   서버·비밀키 없이 동작. 클라이언트 ID는 공개돼도 되는 값.
   ========================================================= */
const DEFAULT_CLIENT_ID = '862190990167-sa7okm4f93cl0bu5pknd2iko8u9efumi.apps.googleusercontent.com';
const YT_SCOPES = ['https://www.googleapis.com/auth/youtube.readonly', 'https://www.googleapis.com/auth/yt-analytics.readonly', 'https://www.googleapis.com/auth/drive.appdata'];
const DATA_API = 'https://www.googleapis.com/youtube/v3/';
const ANALYTICS_API = 'https://youtubeanalytics.googleapis.com/v2/reports';
const SOURCE_MAP = {
  SHORTS: 'Shorts 피드', YT_SEARCH: 'YouTube 검색', RELATED_VIDEO: '추천 동영상', SUBSCRIBER: '탐색 기능',
  YT_CHANNEL: '채널 페이지', EXT_URL: '외부',
};
const mapSource = t => SOURCE_MAP[t] || '기타';
const clientId = () => { try { return localStorage.getItem(KEY + ':clientId') || DEFAULT_CLIENT_ID; } catch (e) { return DEFAULT_CLIENT_ID; } };
let ytToken = null;
try { ytToken = JSON.parse(localStorage.getItem(KEY + ':tok') || 'null'); } catch (e) {}

let gisPromise = null;
function loadGIS() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (!gisPromise) gisPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => { gisPromise = null; rej(new Error('구글 로그인 스크립트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
    document.head.append(s);
  });
  return gisPromise;
}
// 팝업 차단을 피하려면 클릭 직후 동기적으로 requestAccessToken을 불러야 해서, 스크립트는 미리 불러 둔다.
function getToken() {
  if (ytToken && ytToken.exp > Date.now() + 60000 && YT_SCOPES.every(sc => String(ytToken.scope || '').includes(sc))) return Promise.resolve(ytToken.access_token);
  const cid = clientId();
  if (!cid) return Promise.reject(new Error('먼저 설정에서 구글 클라이언트 ID를 입력해 주세요.'));
  const ask = () => new Promise((res, rej) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: cid, scope: YT_SCOPES.join(' '), prompt: DB.yt ? '' : 'consent',
      callback: r => {
        if (r.error) return rej(new Error('구글 로그인 실패: ' + (r.error_description || r.error)));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...YT_SCOPES)) return rej(new Error('권한 화면에서 "모두 선택"으로 세 가지(YouTube 보기, YouTube 분석, 드라이브 앱 데이터)를 모두 허용해야 해요.'));
        ytToken = { access_token: r.access_token, scope: r.scope || YT_SCOPES.join(' '), exp: Date.now() + (+r.expires_in || 3600) * 1000 };
        try { localStorage.setItem(KEY + ':tok', JSON.stringify(ytToken)); } catch (e) {}
        res(ytToken.access_token);
      },
      error_callback: e => rej(new Error(e && e.type === 'popup_closed' ? '로그인 창이 닫혔어요.' : e && e.type === 'popup_failed_to_open' ? '팝업이 차단됐어요. 브라우저에서 팝업을 허용한 뒤 다시 눌러 주세요.' : '구글 로그인 오류: ' + ((e && (e.message || e.type)) || ''))),
    });
    client.requestAccessToken();
  });
  if (window.google && google.accounts && google.accounts.oauth2) return ask();
  return loadGIS().then(ask);
}
async function ytApi(url, params) {
  const u = new URL(url);
  Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null) u.searchParams.set(k, v); });
  for (let attempt = 0; ; attempt++) {
    const r = await fetch(u, { headers: { Authorization: 'Bearer ' + ytToken.access_token } });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    if ((r.status === 429 || r.status >= 500) && attempt < 3) { await new Promise(ok => setTimeout(ok, 800 * 2 ** attempt)); continue; }
    if (r.status === 401) { ytToken = null; try { localStorage.removeItem(KEY + ':tok'); } catch (e) {} }
    const er = j.error || {};
    const reason = (er.errors && er.errors[0] && er.errors[0].reason) || er.status || '';
    const err = new Error(er.message || ('HTTP ' + r.status)); err.status = r.status; err.reason = reason; err.api = url;
    throw err;
  }
}
const rowsOf = j => (j.rows || []).map(r => Object.fromEntries(j.columnHeaders.map((h, i) => [h.name, r[i]])));
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } }));
}
const localDate = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const localTime = iso => { const d = new Date(iso); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function isoSeconds(p) { const m = String(p || '').match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); return m ? (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0) : 0; }
// 일별 누적 기록을 저장 용량에 맞게 줄인다: 업로드 후 30일은 매일, 그 뒤로는 주 1회 + 마지막 날.
function thinStats(stats, up) {
  return stats.filter((s, i) => i === stats.length - 1 || dn(s.date) - up <= 30 || (dn(s.date) - up) % 7 === 0);
}

async function syncYouTube(progress) {
  await getToken();
  progress('채널 정보 확인 중…');
  const chRes = await ytApi(DATA_API + 'channels', { part: 'snippet,statistics,contentDetails', mine: 'true' });
  const ch = chRes.items && chRes.items[0];
  if (!ch) throw new Error('로그인한 구글 계정에 유튜브 채널이 없어요. 로그인할 때 "그냥 은지" 채널(브랜드 계정)을 선택했는지 확인해 주세요.');
  const ids = []; let pageToken = '';
  do {
    const j = await ytApi(DATA_API + 'playlistItems', { part: 'contentDetails', playlistId: ch.contentDetails.relatedPlaylists.uploads, maxResults: 50, pageToken });
    (j.items || []).forEach(it => ids.push(it.contentDetails.videoId)); pageToken = j.nextPageToken || '';
  } while (pageToken);
  progress(`영상 ${ids.length}개 정보 불러오는 중…`);
  const vids = [];
  for (let i = 0; i < ids.length; i += 50) {
    const j = await ytApi(DATA_API + 'videos', { part: 'snippet,statistics,contentDetails,status', id: ids.slice(i, i + 50).join(',') });
    vids.push(...(j.items || []));
  }
  const pub = vids.filter(v => v.status && v.status.privacyStatus !== 'private');
  const today = ds(todayN());
  const chStart = localDate(ch.snippet.publishedAt);
  const A = p => ytApi(ANALYTICS_API, Object.assign({ ids: 'channel==MINE', startDate: chStart, endDate: today }, p));
  progress('채널 일별 분석 불러오는 중…');
  const daily = rowsOf(await A({ dimensions: 'day', metrics: 'views,likes,comments,subscribersGained,subscribersLost,estimatedMinutesWatched', sort: 'day' }));
  const perVideo = new Map(rowsOf(await A({ dimensions: 'video', metrics: 'views,estimatedMinutesWatched,averageViewDuration', sort: '-views', maxResults: 200 })).map(r => [r.video, r]));

  let done = 0;
  const detail = new Map();
  await pool(pub, 3, async v => {
    const f = `video==${v.id}`, vs = localDate(v.snippet.publishedAt);
    const soft = p => p.catch(e => { console.warn('선택 항목 실패', v.id, e); return null; });
    const [d, tr, kw, ct] = await Promise.all([
      A({ startDate: vs, dimensions: 'day', metrics: 'views,likes,comments,subscribersGained', filters: f, sort: 'day' }),
      soft(A({ startDate: vs, dimensions: 'insightTrafficSourceType', metrics: 'views,estimatedMinutesWatched', filters: f })),
      soft(A({ startDate: vs, dimensions: 'insightTrafficSourceDetail', metrics: 'views', filters: f + ';insightTrafficSourceType==YT_SEARCH', sort: '-views', maxResults: 10 })),
      soft(A({ startDate: vs, dimensions: 'creatorContentType', metrics: 'views', filters: f })),
    ]);
    detail.set(v.id, { d: rowsOf(d), tr: tr ? rowsOf(tr) : [], kw: kw ? rowsOf(kw) : [], ct: ct ? rowsOf(ct) : [] });
    progress(`영상별 분석 ${++done} / ${pub.length}`);
  });

  // ---- 저장 구조로 합치기 (회고·유형·태그 등 직접 쓴 내용은 보존) ----
  if (DB.isSample) { DB.contents = []; DB.subscriberHistory = []; DB.isSample = false; }
  pub.forEach(v => {
    const x = detail.get(v.id) || { d: [], tr: [], kw: [], ct: [] };
    let c = DB.contents.find(y => y.ytId === v.id) || DB.contents.find(y => !y.ytId && ytId(y.url) === v.id);
    const isNew = !c;
    if (isNew) {
      const tags = [...new Set(((v.snippet.title || '') + ' ' + (v.snippet.description || '')).match(/#[^\s#]+/g) || [])].map(t => t.slice(1)).filter(t => !/^shorts?$/i.test(t)).slice(0, 5);
      c = { id: uid(), type: '기타', series: '', tags, log: {}, createdAt: Date.now() };
      DB.contents.push(c);
    }
    const up = dn(localDate(v.snippet.publishedAt));
    let cv = 0, cl = 0, cc = 0, cs = 0;
    let stats = x.d.map(r => { cv += +r.views || 0; cl += +r.likes || 0; cc += +r.comments || 0; cs += +r.subscribersGained || 0; return { date: r.day, views: cv, likes: cl, comments: cc, subs: cs }; })
      .filter(s => dn(s.date) >= up);
    stats = thinStats(stats, up);
    const st = v.statistics || {};
    const live = { views: +st.viewCount || 0, likes: +st.likeCount || 0, comments: +st.commentCount || 0 };
    if (live.views >= cv && (!stats.length || stats[stats.length - 1].date !== today)) stats.push({ date: today, views: live.views, likes: Math.max(cl, live.likes), comments: Math.max(cc, live.comments), subs: cs });
    const traffic = {}, trafficMinutes = {};
    x.tr.forEach(r => { const k = mapSource(r.insightTrafficSourceType); traffic[k] = (traffic[k] || 0) + (+r.views || 0); trafficMinutes[k] = (trafficMinutes[k] || 0) + (+r.estimatedMinutesWatched || 0); });
    const secs = isoSeconds(v.contentDetails && v.contentDetails.duration);
    let format;
    const ctTop = x.ct.slice().sort((a, b) => b.views - a.views)[0];
    if (ctTop && ctTop.creatorContentType) format = /short/i.test(ctTop.creatorContentType) ? 'Shorts' : '롱폼';
    else { const tv = sum(Object.values(traffic)); format = (tv && (traffic['Shorts 피드'] || 0) / tv >= 0.5) || (secs && secs <= 60) ? 'Shorts' : '롱폼'; }
    const pv = perVideo.get(v.id) || {};
    Object.assign(c, {
      ytId: v.id, title: v.snippet.title, description: v.snippet.description || '',
      url: `https://www.youtube.com/${format === 'Shorts' ? 'shorts/' : 'watch?v='}${v.id}`,
      thumbnail: ((v.snippet.thumbnails || {}).medium || (v.snippet.thumbnails || {}).default || {}).url || '',
      uploadDate: localDate(v.snippet.publishedAt), uploadTime: localTime(v.snippet.publishedAt),

  for (let d = start; d <= T; d += 7) raw.push(d);
  if (raw[raw.length - 1] !== T) raw.push(T);
  const gainedUntil = d => sum(contents, c => cumAt(c, 'subs', d));
  raw.forEach(d => hist.push({ date: ds(d), count: Math.round(gainedUntil(d) * 1.15 + (d - start) * 0.35) }));
  const off = 2571 - hist[hist.length - 1].count;
  hist.forEach(h => h.count += off);
  return { isSample: true, channel: { name: '그냥 은지', owner: '은지', url: '' }, subscriberHistory: hist, contents };
}

/* =========================================================
   계산
   ========================================================= */
// 누적 기록(스냅샷) 사이를 선형 보간한 누적값. 업로드일 = 0, 마지막 기록 이후는 그대로 유지.
function points(c, m) {
  const pts = [{ d: dn(c.uploadDate), v: 0 }];
  c.stats.slice().sort((a, b) => dn(a.date) - dn(b.date)).forEach(s => {
    const d = dn(s.date); const v = +s[m] || 0;
    if (d <= pts[0].d) pts[0].v = Math.max(pts[0].v, v);
    else pts.push({ d, v });
  });
  return pts;
}
const _pc = new Map();
function cumAt(c, m, n) {
  const k = c.id + m + (c._v || 0);
  let pts = _pc.get(k); if (!pts) { pts = points(c, m); _pc.set(k, pts); }
  if (n < pts[0].d) return 0;
  for (let i = 1; i < pts.length; i++) {
    if (n <= pts[i].d) { const a = pts[i - 1], b = pts[i]; return a.v + (b.v - a.v) * (n - a.d) / (b.d - a.d); }
  }
  return pts[pts.length - 1].v;
}
function bust(c) { c._v = (c._v || 0) + 1; }
const latest = c => { const s = c.stats.slice().sort((a, b) => dn(b.date) - dn(a.date))[0]; return s || { views: 0, likes: 0, comments: 0, subs: 0, date: c.uploadDate }; };
function total(c) { const s = latest(c); return { views: +s.views || 0, likes: +s.likes || 0, comments: +s.comments || 0, subs: +s.subs || 0 }; }
function inRange(c, s, e) { const o = {}; for (const m in METRICS) o[m] = Math.max(0, cumAt(c, m, e) - cumAt(c, m, s - 1)); return o; }
function subsAt(n) {
  const h = DB.subscriberHistory.slice().sort((a, b) => dn(a.date) - dn(b.date));
  if (!h.length) return null;
  if (n <= dn(h[0].date)) return +h[0].count;
  for (let i = 1; i < h.length; i++) {
    const a = h[i - 1], b = h[i], da = dn(a.date), db = dn(b.date);
    if (n <= db) return +a.count + (b.count - a.count) * (n - da) / (db - da);
  }
  return +h[h.length - 1].count;
}
const currentSubs = () => { const h = DB.subscriberHistory.slice().sort((a, b) => dn(b.date) - dn(a.date))[0]; return h ? +h.count : null; };

/* ---------- 기간 ---------- */
const PERIODS = [['7', '최근 7일'], ['30', '최근 30일'], ['90', '최근 90일'], ['year', '올해'], ['all', '전체'], ['custom', '사용자 지정']];
let period = { key: '30', start: '', end: '' };
try { const p = JSON.parse(localStorage.getItem(KEY + ':period') || 'null'); if (p && p.key) period = p; } catch (e) {}
function range() {
  // YouTube 분석은 2~3일 늦게 들어오므로, 연동 중이면 마지막 데이터 날짜를 '오늘'로 본다.
  const T = DB.yt && DB.yt.dataUntil ? Math.min(todayN(), dn(DB.yt.dataUntil)) : todayN();
  let s, e = T;
  if (['7', '30', '90'].includes(period.key)) s = T - (+period.key - 1);
  else if (period.key === 'year') s = dn(new Date().getFullYear() + '-01-01');
  else if (period.key === 'all') {
    const firsts = DB.contents.map(c => dn(c.uploadDate)).concat(DB.subscriberHistory.map(h => dn(h.date)));
    s = firsts.length ? Math.min(...firsts) : T - 29;
  } else {
    s = period.start ? dn(period.start) : T - 29; e = period.end ? dn(period.end) : T;
    if (s > e) [s, e] = [e, s];
  }
  const len = e - s + 1;
  return { s, e, len, ps: s - len, pe: s - 1, hasPrev: period.key !== 'all', label: PERIODS.find(p => p[0] === period.key)[1] };
}
function periodTotals(s, e) {
  const o = { views: 0, likes: 0, comments: 0, subs: 0 };
  // YouTube 연동 시에는 채널 일별 분석(삭제·비공개 영상 포함, 정확한 값)을 쓴다.
  if (DB.channelDaily && DB.channelDaily.length) {
    o.lost = 0;
    for (const r of DB.channelDaily) { const d = dn(r.date); if (d >= s && d <= e) { o.views += r.views; o.likes += r.likes; o.comments += r.comments; o.subs += r.subsGained; o.lost += r.subsLost; } }
    return o;
  }
  DB.contents.forEach(c => { const r = inRange(c, s, e); for (const m in o) o[m] += r[m]; });
  return o;
}
function deltaHTML(cur, prev, R, unit = '') {
  if (!R.hasPrev) return `<div class="delta">${esc(R.label)} 기준</div>`;
  if (!prev) return `<div class="delta">이전 기간 기록 없음</div>`;
  const p = (cur - prev) / Math.abs(prev) * 100;
  const cls = p > 0 ? 'up' : p < 0 ? 'down' : '';
  const arrow = p > 0 ? '↑' : p < 0 ? '↓' : '→';
  return `<div class="delta"><span class="${cls}">${arrow} ${Math.abs(p).toFixed(1)}%</span> 이전 ${R.len}일 대비${unit}</div>`;
}

function ytId(url) {
  if (!url) return '';
  const m = String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : '';
}
function thumbSrc(c) { if (c.thumbnail) return c.thumbnail; const id = ytId(c.url); return id ? `https://i.ytimg.com/vi/${id}/mqdefault.jpg` : ''; }
function hue(str) { let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function thumbHTML(c, cls = '') {
  const src = thumbSrc(c);
  const h = hue(c.title || '');
  const ph = `<div class="thumb ${cls}" style="background:linear-gradient(135deg,hsl(${h} 60% 72%),hsl(${(h + 50) % 360} 55% 62%))" aria-hidden="true">${esc((c.title || '?').trim().slice(0, 2))}</div>`;
  if (!src) return ph;

const tipEl = $('#tip');
function showTip(x, y, title, rows) {
  tipEl.replaceChildren();
  if (title) { const t = document.createElement('div'); t.className = 't'; t.textContent = title; tipEl.append(t); }
  rows.forEach(r => {
    const row = document.createElement('div'); row.className = 'r';
    const sp = document.createElement('span');
    if (r.color) { const i = document.createElement('i'); i.style.background = r.color; sp.append(i); }
    sp.append(document.createTextNode(r.label));
    const b = document.createElement('b'); b.textContent = r.value;
    row.append(sp, b); tipEl.append(row);
  });
  tipEl.classList.add('on');
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = x + 14, top = y + 14;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top + h > innerHeight - 8) top = y - h - 14;
  tipEl.style.left = Math.max(8, left) + 'px'; tipEl.style.top = Math.max(8, top) + 'px';
}
function hideTip() { tipEl.classList.remove('on'); }
// data-tip='{"t":"..","r":[{"label":..,"value":..,"color":..}]}'
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { if (!e.target.closest || !e.target.closest('.chart')) hideTip(); return; }
  try { const d = JSON.parse(el.dataset.tip); showTip(e.clientX, e.clientY, d.t, d.r || []); } catch (err) {}
});
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) return;
  const b = el.getBoundingClientRect();
  try { const d = JSON.parse(el.dataset.tip); showTip(b.right, b.top, d.t, d.r || []); } catch (err) {}
});
document.addEventListener('focusout', hideTip);
const tipAttr = (t, rows) => `data-tip="${esc(JSON.stringify({ t, r: rows }))}"`;

/* =========================================================
   차트
   ========================================================= */
function niceStep(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

/**
 * 선 그래프. opts: { x:[라벨], series:[{label,color,values}], height, zero(0부터), area, tip(i)=>{t,rows}, yfmt }
 */
function lineChart(el, opts) {
  const W = Math.max(280, el.clientWidth || 600), H = opts.height || 240;
  const pl = 46, pr = 14, pt = 12, pb = 26;
  const iw = W - pl - pr, ih = H - pt - pb;
  const all = opts.series.flatMap(s => s.values);
  let lo = opts.zero === false ? Math.min(...all) : 0, hi = Math.max(...all, 1);
  if (opts.zero === false && hi === lo) { hi += 1; lo -= 1; }
  const step = Math.max(1, niceStep((hi - lo) / 4));
  lo = opts.zero === false ? Math.floor(lo / step) * step : 0;
  hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const n = opts.x.length;
  const X = i => pl + (n <= 1 ? iw / 2 : iw * i / (n - 1));
  const Y = v => pt + ih - (v - lo) / (hi - lo) * ih;
  const yfmt = opts.yfmt || compact;
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line class="gridline" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/>`;
    g += `<text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(yfmt(v))}</text>`;
  }
  const tickN = Math.min(n, Math.max(2, Math.floor(iw / 80)));
  const used = new Set();
  for (let k = 0; k < tickN; k++) {
    const i = tickN === 1 ? 0 : Math.round(k * (n - 1) / (tickN - 1));
    if (used.has(i)) continue; used.add(i);
    const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    g += `<text x="${X(i)}" y="${H - 6}" text-anchor="${n <= 1 ? 'middle' : anchor}">${esc(opts.x[i])}</text>`;
  }
  let marks = '';
  opts.series.forEach(s => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    if (opts.area !== false && opts.series.length === 1) {
      marks += `<path d="${d}L${X(n - 1).toFixed(1)},${Y(lo)}L${X(0).toFixed(1)},${Y(lo)}Z" fill="${s.color}" opacity=".1"/>`;
    }
    marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (n === 1 || opts.dots) s.values.forEach((v, i) => { marks += `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
    const li = n - 1;
    marks += `<circle cx="${X(li)}" cy="${Y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.aria || '')}">
    <g class="axis">${g}</g>${marks}
    <line class="cross" y1="${pt}" y2="${pt + ih}" x1="-10" x2="-10" visibility="hidden"/>
    <g class="hov"></g>
    <rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair" tabindex="0"/>
  </svg>`;
  const svg = el.firstElementChild, cross = svg.querySelector('.cross'), hov = svg.querySelector('.hov'), hit = svg.querySelector('rect');
  const at = (i, cx, cy) => {
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    hov.innerHTML = opts.series.map(s => `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    const t = opts.tip ? opts.tip(i) : { t: opts.x[i], rows: opts.series.map(s => ({ label: s.label, value: fmt(s.values[i]), color: s.color })) };
    showTip(cx, cy, t.t, t.rows);
  };
  const clear = () => { cross.setAttribute('visibility', 'hidden'); hov.innerHTML = ''; hideTip(); };
  hit.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) * W / r.width;
    const i = n <= 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((x - pl) / iw * (n - 1))));
    at(i, e.clientX, e.clientY);
  });
  hit.addEventListener('pointerleave', clear);
  let ki = n - 1;
  hit.addEventListener('focus', () => { const r = svg.getBoundingClientRect(); at(ki, r.left + X(ki) * r.width / W, r.top + 20); });
  hit.addEventListener('blur', clear);
  hit.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); ki = Math.max(0, Math.min(n - 1, ki + (e.key === 'ArrowRight' ? 1 : -1)));
    const r = svg.getBoundingClientRect(); at(ki, r.left + X(ki) * r.width / W, r.top + 20);
  });
}

function donutHTML(items, centerTop, centerBottom, onClickHref) {
  const tot = sum(items, x => x.value);
  const R = 60, C = 2 * Math.PI * R, gap = tot ? 2 : 0;
  let off = 0, arcs = '';
  items.forEach(it => {
    const len = tot ? it.value / tot * C : 0;
    if (len <= 0) return;
    const draw = Math.max(0.5, len - gap);
    arcs += `<circle class="seg-arc" cx="75" cy="75" r="${R}" fill="none" stroke="${it.color}" stroke-width="18"
      stroke-dasharray="${draw} ${C - draw}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"
      ${tipAttr(it.label, [{ label: '조회수', value: fmt(it.value) }, { label: '비율', value: pct(it.value, tot) }])}
      ${onClickHref ? `onclick="location.hash='${onClickHref}'"` : ''}/>`;
    off += len;
  });
  if (!tot) arcs = `<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>`;
  const legend = items.map(it => `<button type="button" ${onClickHref ? `onclick="location.hash='${onClickHref}'"` : ''} ${tipAttr(it.label, [{ label: '조회수', value: fmt(it.value) }])}>
      <span class="sw" style="background:${it.color}"></span><span class="nm">${esc(it.label)}</span><span class="pc">${pct(it.value, tot)}</span></button>`).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 150 150" role="img" aria-label="유입 경로 비율">${arcs}
    <text x="75" y="72" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">${esc(centerTop)}</text>
    <text x="75" y="91" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(centerBottom)}</text></svg>
    <div class="donut-legend">${legend}</div></div>`;
}

function barsHTML(rows, color, valFmt = fmt, extra) {

/* ---------- 인사이트 (통계 기반, AI 미사용) ---------- */
function insights(R) {
  const out = [];
  const cur = periodTotals(R.s, R.e);
  if (R.hasPrev) {
    const prev = periodTotals(R.ps, R.pe);
    if (prev.views) {
      const p = (cur.views - prev.views) / prev.views * 100;
      out.push({ lv: '통계', html: `${esc(R.label)} 조회수가 이전 기간보다 <b>${Math.abs(p).toFixed(0)}% ${p >= 0 ? '늘었어요' : '줄었어요'}</b>. (${fmt(prev.views)} → ${fmt(cur.views)})` });
    }
  }
  const tots = DB.contents.map(c => ({ c, ...total(c) })).filter(x => x.views > 0);
  if (!tots.length) return out;
  const sh = tots.filter(x => x.c.format === 'Shorts'), lg = tots.filter(x => x.c.format === '롱폼');
  if (sh.length && lg.length) {
    const a = avg(sh, x => x.views), b = avg(lg, x => x.views);
    const [hiN, loN, r] = a >= b ? ['Shorts', '롱폼', a / b] : ['롱폼', 'Shorts', b / a];
    const sa = avg(sh, x => x.subs / x.views * 1000), sb = avg(lg, x => x.subs / x.views * 1000);
    const conv = (a >= b) === (sa >= sb) ? '' : ` 다만 조회수 1,000회당 구독 전환은 <b>${esc(loN)}</b> 쪽이 더 높아요 (${(Math.max(sa, sb)).toFixed(1)}명 vs ${(Math.min(sa, sb)).toFixed(1)}명).`;
    out.push({ lv: '비교', html: `<b>${esc(hiN)}</b>가 ${esc(loN)}보다 평균 조회수가 <b>${r.toFixed(1)}배</b> 높아요.${conv}` });
  }
  const overall = avg(tots, x => x.views);
  const tagStats = tagTable().filter(t => t.count >= 2).sort((a, b) => b.avgViews - a.avgViews);
  if (tagStats.length && overall) {
    const t = tagStats[0];
    const p = (t.avgViews - overall) / overall * 100;
    if (p > 5) {
      const combo = pairTag(t.name);
      out.push({ lv: '패턴', html: `<b>#${esc(t.name)}</b> 콘텐츠의 평균 조회수가 전체 평균보다 <b>${p.toFixed(0)}% 높아요</b> (콘텐츠 ${t.count}개).${combo ? ` 특히 <b>#${esc(combo)}</b>와 함께 쓴 콘텐츠의 반응이 좋았어요. 다음엔 <b>${esc(t.name)} + ${esc(combo)}</b> 조합을 테스트해 보세요.` : ''}` });
    }
  }
  if (tots.length >= 4) {
    const med = tots.map(x => x.views).sort((a, b) => a - b)[Math.floor(tots.length / 2)];
    const low = tots.filter(x => x.views < med && x.subs > 0).sort((a, b) => b.subs / b.views - a.subs / a.views)[0];
    const avgConv = sum(tots, x => x.subs) / sum(tots, x => x.views) * 1000;
    if (low && low.subs / low.views * 1000 > avgConv * 1.2) {
      out.push({ lv: '발견', html: `<b>${esc(low.c.title)}</b>은(는) 조회수는 낮지만 구독 전환율이 높아요 — 1,000회당 <b>${(low.subs / low.views * 1000).toFixed(1)}명</b> (채널 평균 ${avgConv.toFixed(1)}명).` });
    }
    const best = tots.filter(x => x.views >= 300).sort((a, b) => b.likes / b.views - a.likes / a.views)[0];
    if (best) out.push({ lv: '발견', html: `좋아요율이 가장 높은 콘텐츠는 <b>${esc(best.c.title)}</b> (${pct(best.likes, best.views)}). 시청자 반응이 강한 콘텐츠예요.` });
  }
  return out;
}
function tagTable() {
  const map = new Map();
  DB.contents.forEach(c => {
    const t = total(c);
    c.tags.forEach(tag => {
      const o = map.get(tag) || { name: tag, count: 0, views: 0, likes: 0, comments: 0, subs: 0 };
      o.count++; o.views += t.views; o.likes += t.likes; o.comments += t.comments; o.subs += t.subs; map.set(tag, o);
    });
  });
  return [...map.values()].map(o => ({ ...o, avgViews: o.views / o.count, rate: o.views ? o.likes / o.views * 100 : 0 }));
}
function pairTag(tag) {
  const withT = DB.contents.filter(c => c.tags.includes(tag));
  const m = new Map();
  withT.forEach(c => c.tags.forEach(o => { if (o === tag) return; const x = m.get(o) || { n: 0, v: 0 }; x.n++; x.v += total(c).views; m.set(o, x); }));
  const best = [...m.entries()].filter(([, x]) => x.n >= 2).sort((a, b) => b[1].v / b[1].n - a[1].v / a[1].n)[0];
  return best ? best[0] : '';
}

function dailySeries(R) {
  const days = []; for (let d = R.s; d <= R.e; d++) days.push(d);
  const bucket = R.len > 120 ? 7 : 1;
  const groups = [];
  for (let i = 0; i < days.length; i += bucket) groups.push([days[i], days[Math.min(days.length - 1, i + bucket - 1)]]);
  const rows = groups.map(([a, b]) => ({ a, b, ...periodTotals(a, b) }));
  return { rows, bucket };
}

function aggTraffic(R) {
  const m = Object.fromEntries(SOURCES.map(s => [s, 0])), mm = Object.fromEntries(SOURCES.map(s => [s, 0]));
  DB.contents.forEach(c => {
    const tv = sum(Object.values(c.traffic || {})); if (!tv) return;
    const pv = inRange(c, R.s, R.e).views; const T = total(c).views || tv;
    const ratio = pv / T;
    for (const [k, v] of Object.entries(c.traffic)) { if (k in m) m[k] += v * ratio; else m['기타'] += v * ratio; }
    for (const [k, v] of Object.entries(c.trafficMinutes || {})) { mm[k in mm ? k : '기타'] += v * ratio; }
  });

}
function aggKeywords(R) {
  const m = new Map();
  DB.contents.forEach(c => {
    const T = total(c).views; if (!T) return;
    const ratio = R ? inRange(c, R.s, R.e).views / T : 1;
    (c.keywords || []).forEach(k => { const key = String(k.keyword).trim(); if (!key) return; m.set(key, (m.get(key) || 0) + (+k.views || 0) * ratio); });
  });
  return [...m.entries()].map(([keyword, views]) => ({ keyword, views: Math.round(views) })).filter(x => x.views > 0).sort((a, b) => b.views - a.views);
}

/* =========================================================
   페이지: 추천 (통계 규칙 기반, AI 미사용)

const normKw = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const squash = s => normKw(s).replace(/\s/g, '');
// 검색어별로 선택 기간 유입, 이전 기간 유입, 그 검색어로 들어온 영상들을 모은다.
function keywordStats(R) {
  const m = new Map();
  const add = (c, k, ratioCur, ratioPrev) => {
    const key = normKw(k.keyword); if (!key) return;
    const o = m.get(key) || { key, label: String(k.keyword).trim(), cur: 0, prev: 0, total: 0, videos: [] };
    const v = +k.views || 0;
    o.cur += v * ratioCur; o.prev += v * ratioPrev; o.total += v;
    o.videos.push({ c, views: v });
    m.set(key, o);
  };
  DB.contents.forEach(c => {
    const T = total(c).views; if (!T) return;
    const rc = inRange(c, R.s, R.e).views / T;
    const rp = R.hasPrev ? inRange(c, R.ps, R.pe).views / T : 0;
    (c.keywords || []).forEach(k => add(c, k, rc, rp));
  });
  return [...m.values()].map(o => {
    const inTitle = DB.contents.filter(c => squash(c.title).includes(squash(o.key))).length;
    o.videos.sort((a, b) => b.views - a.views);
    const fmtViews = {}; o.videos.forEach(x => { fmtViews[x.c.format] = (fmtViews[x.c.format] || 0) + x.views; });
    const bestFmt = Object.entries(fmtViews).sort((a, b) => b[1] - a[1])[0];
    const growth = R.hasPrev ? (o.cur + 1) / (o.prev + 1) : 1;
    return { ...o, inTitle, bestFmt: bestFmt ? bestFmt[0] : '', growth, score: o.cur * (1 / (1 + Math.max(o.videos.length, inTitle))) * Math.min(3, Math.max(0.5, growth)) };
  }).filter(o => o.cur >= 1 || o.total > 0);
}
function comboStats() {
  const tots = DB.contents.map(c => ({ c, ...total(c) })).filter(x => x.views > 0);
  const overall = avg(tots, x => x.views);
  const overallConv = sum(tots, x => x.subs) / (sum(tots, x => x.views) || 1) * 1000;
  const group = (keyOf) => {
    const m = new Map();
    tots.forEach(x => keyOf(x.c).forEach(k => { const a = m.get(k) || []; a.push(x); m.set(k, a); }));
    return [...m.entries()].filter(([, xs]) => xs.length >= 2).map(([k, xs]) => ({
      k, n: xs.length, views: avg(xs, x => x.views), conv: sum(xs, x => x.subs) / (sum(xs, x => x.views) || 1) * 1000,
      rate: sum(xs, x => x.likes) / (sum(xs, x => x.views) || 1) * 100, best: xs.slice().sort((a, b) => b.views - a.views)[0].c,
    })).sort((a, b) => b.views - a.views);
  };
  const formatType = group(c => [`${c.format} · ${c.type || '기타'}`]);
  const tagPairs = group(c => { const t = c.tags.slice().sort(); const out = []; for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) out.push(`#${t[i]} + #${t[j]}`); return out; });
  // 업로드 요일: 공정하게 비교하려고 업로드 후 7일 조회수를 쓴다.
  const W = ['일', '월', '화', '수', '목', '금', '토'];
  const week = new Map();
  DB.contents.forEach(c => {
    const up = dn(c.uploadDate); if (todayN() - up < 7) return;
    const d = new Date(up * DAY).getUTCDay(); const a = week.get(d) || []; a.push(cumAt(c, 'views', up + 7)); week.set(d, a);
  });
  const weekRows = [...week.entries()].filter(([, a]) => a.length >= 2).map(([d, a]) => ({ d: W[d] + '요일', n: a.length, v: avg(a) })).sort((a, b) => b.v - a.v);
  const hour = new Map();
  const slot = t => { const h = +String(t || '').slice(0, 2); if (isNaN(h) || !t) return null; return h < 6 ? '새벽(0~6시)' : h < 12 ? '오전(6~12시)' : h < 18 ? '오후(12~18시)' : '저녁(18~24시)'; };
  DB.contents.forEach(c => { const up = dn(c.uploadDate); const s = slot(c.uploadTime); if (!s || todayN() - up < 7) return; const a = hour.get(s) || []; a.push(cumAt(c, 'views', up + 7)); hour.set(s, a); });
  const hourRows = [...hour.entries()].filter(([, a]) => a.length >= 2).map(([k, a]) => ({ k, n: a.length, v: avg(a) })).sort((a, b) => b.v - a.v);
  return { overall, overallConv, formatType, tagPairs, weekRows, hourRows };
}
function buildRecs(R) {
  const kws = keywordStats(R).sort((a, b) => b.score - a.score);
  const cs = comboStats();
  const recs = [];
  const bestFT = cs.formatType[0];

    if (k.cur < 1) return;

    const n = Math.max(k.videos.length, k.inTitle);
    why.push(n <= 1 ? `그런데 이 검색어로 찾을 수 있는 영상이 <b>${n}개뿐</b>이에요. 후속 영상이 있으면 검색 유입을 더 받을 수 있어요.` : `관련 영상은 ${n}개 있어요. 가장 많이 받은 건 "${esc(k.videos[0].c.title)}".`);
    if (k.inTitle === 0) why.push(`아직 제목에 "${esc(k.label)}"이(가) 들어간 영상이 없어요. 제목에 검색어를 그대로 넣어 보세요.`);
    const f = k.bestFmt || (bestFT ? bestFT.k.split(' · ')[0] : '');
    if (f) why.push(`이 검색어는 <b>${esc(f)}</b> 영상에서 반응이 가장 컸어요.`);
    recs.push({ kind: '검색어 기회', title: `"${esc(k.label)}" 주제로 ${esc(f || '새 영상')} 한 편 더`, why, idea: `"${k.label}" 주제 ${f || ''} (검색 유입 ${fmt(k.cur)}회, 관련 영상 ${n}개)`.trim() });
  });
  if (bestFT && cs.overall && bestFT.views > cs.overall * 1.1) {
    recs.push({ kind: '잘 되는 조합', title: `${esc(bestFT.k)} 포맷을 이어가기`, why: [`${esc(bestFT.k)} 콘텐츠 ${bestFT.n}개의 평균 조회수가 <b>${fmt(bestFT.views)}</b>로 채널 평균(${fmt(cs.overall)})보다 <b>${((bestFT.views / cs.overall - 1) * 100).toFixed(0)}% 높아요</b>.`, `대표 영상: "${esc(bestFT.best.title)}"`], idea: `${bestFT.k} 포맷으로 새 영상 (평균 조회수 ${fmt(bestFT.views)})` });
  }
  const convBest = cs.formatType.slice().sort((a, b) => b.conv - a.conv)[0];

    recs.push({ kind: '구독 전환', title: `구독자를 늘리려면 ${esc(convBest.k)}`, why: [`조회수 1,000회당 <b>${convBest.conv.toFixed(1)}명</b>이 구독했어요 (채널 평균 ${cs.overallConv.toFixed(1)}명). 조회수보다 구독자를 늘리고 싶을 때 좋은 포맷이에요.`], idea: `${convBest.k} (구독 전환 1천회당 ${convBest.conv.toFixed(1)}명)` });
  }
  const tp = cs.tagPairs[0];
  if (tp && cs.overall && tp.views > cs.overall * 1.1) {
    recs.push({ kind: '소재 조합', title: `${esc(tp.k)} 조합 다시 테스트`, why: [`두 소재를 함께 쓴 영상 ${tp.n}개의 평균 조회수가 <b>${fmt(tp.views)}</b>로 채널 평균보다 <b>${((tp.views / cs.overall - 1) * 100).toFixed(0)}% 높아요</b>.`], idea: `${tp.k} 조합 콘텐츠` });
  }
  return { recs, kws, cs };
}

/* =========================================================
   페이지: 콘텐츠 상세

function pageDetail(id) {
  const c = DB.contents.find(x => x.id === id);
  if (!c) return `<a class="back" href="#/contents">← 콘텐츠 목록</a><div class="card empty"><b>콘텐츠를 찾을 수 없어요</b>삭제되었을 수 있어요.</div>`;
  const t = total(c);
  const others = DB.contents.filter(x => x.id !== c.id).map(total).filter(x => x.views > 0);
  const cmpRow = (label, mine, base, unit, dec) => {
    if (!others.length || !base) return `<div><span>${label}</span><b>—</b><small>비교할 콘텐츠가 부족해요</small></div>`;
    const p = (mine - base) / base * 100;
    return `<div><span>${label}</span><b class="${p >= 0 ? '' : ''}" style="color:${p >= 0 ? 'var(--up)' : 'var(--down)'}">${p >= 0 ? '+' : '−'}${Math.abs(p).toFixed(0)}%</b><small>이 콘텐츠 ${dec ? mine.toFixed(dec) : fmt(mine)}${unit} · 평균 ${dec ? base.toFixed(dec) : fmt(base)}${unit}</small></div>`;
  };
  const avgV = avg(others, x => x.views);
  const rateOf = (arr, k) => sum(arr, x => x[k]) / (sum(arr, x => x.views) || 1);
  const myRate = t.views ? t.likes / t.views * 100 : 0, myC = t.views ? t.comments / t.views * 100 : 0, mySub = t.views ? t.subs / t.views * 1000 : 0;
  const tr = SOURCES.map((s, i) => ({ label: s, value: +c.traffic[s] || 0, color: SOURCE_COLORS[i] }));
  const L = c.log || {};
  const qa = (q, a) => `<div><dt>${esc(q)}</dt><dd class="${a ? '' : 'none'}">${a ? esc(a) : '아직 기록 안 함'}</dd></div>`;
  const stats = c.stats.slice().sort((a, b) => dn(b.date) - dn(a.date));
  const up = dn(c.uploadDate);
  return `
  <a class="back" href="#/contents">← 콘텐츠 목록</a>
  <div class="d-head">
    <div>${thumbSrc(c) || c.url ? `<a href="${esc(c.url || '#')}" target="_blank" rel="noopener">${thumbHTML(c, 'lg')}</a>` : thumbHTML(c, 'lg')}</div>
    <div>
      <div class="d-meta">${fmtBadge(c)} <span>${esc(c.type || '')}</span>${c.series ? ` · <span>시리즈: ${esc(c.series)}</span>` : ''}</div>
      <h1>${esc(c.title)}</h1>
      <div class="d-meta"><span>업로드 ${ymd(up)}${c.uploadTime ? ' ' + esc(c.uploadTime) : ''}</span><span>·</span><span>마지막 기록 ${ymd(dn(latest(c).date))}</span>
        ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">YouTube에서 보기 ↗</a>` : ''}</div>
      <div>${c.tags.map(x => `<a class="tag" href="#/contents?tag=${encodeURIComponent(x)}" style="text-decoration:none">#${esc(x)}</a>`).join('')}</div>
      <div class="d-stats">
        <div class="kpi"><span class="val">${fmt(t.views)}</span><span class="lbl"><span class="dot" style="background:var(--views)"></span>조회수</span></div>
        <div class="kpi"><span class="val">${fmt(t.likes)}</span><span class="lbl"><span class="dot" style="background:var(--likes)"></span>좋아요 · ${pct(t.likes, t.views)}</span></div>
        <div class="kpi"><span class="val">${fmt(t.comments)}</span><span class="lbl"><span class="dot" style="background:var(--comments)"></span>댓글 · ${pct(t.comments, t.views, 2)}</span></div>
        <div class="kpi"><span class="val">${signed(t.subs)}</span><span class="lbl"><span class="dot" style="background:var(--subs)"></span>구독자 증가</span></div>
      </div>
      ${c.ytId && (c.avgViewDuration || c.minutesWatched) ? `<div class="d-meta" style="margin-top:12px">
        <span>⏱ 평균 시청 ${Math.floor(c.avgViewDuration / 60)}분 ${Math.round(c.avgViewDuration % 60)}초${c.durationSec ? ` (영상 길이의 ${pct(c.avgViewDuration, c.durationSec, 0)})` : ''}</span><span>·</span>
        <span>총 시청시간 ${fmt(c.minutesWatched / 60)}시간</span></div>` : ''}
      <div class="top-actions" style="margin-top:16px">
        ${c.ytId ? `<span class="muted small">▶ YouTube에서 자동 기록</span>` : `<button class="btn primary" data-act="snapshot" data-id="${esc(c.id)}">＋ 오늘 성과 기록</button>`}
        <button class="btn" data-act="edit" data-id="${esc(c.id)}">수정</button>
        <button class="btn danger" data-act="delete" data-id="${esc(c.id)}">삭제</button>
      </div>
    </div>
  </div>
  <div class="card" style="margin:20px 0 16px"><div class="card-h"><h2>평균 콘텐츠와 비교</h2><span class="sub">다른 콘텐츠 ${others.length}개의 누적 성과 기준</span></div>
    <div class="cmp">
      ${cmpRow('조회수', t.views, avgV, '', 0)}
      ${cmpRow('좋아요율', myRate, rateOf(others, 'likes') * 100, '%', 1)}
      ${cmpRow('댓글률', myC, rateOf(others, 'comments') * 100, '%', 2)}
      ${cmpRow('구독 전환', mySub, rateOf(others, 'subs') * 1000, '명', 1)}
    </div><p class="muted small" style="margin:10px 0 0">구독 전환 = 조회수 1,000회당 늘어난 구독자 수</p></div>
  <div class="grid g-21">
    <div class="card"><div class="card-h"><h2>성과 그래프</h2><span class="sub">업로드 이후 누적</span><span class="sp"></span>
      <div class="seg" role="group" aria-label="지표">${Object.entries(METRICS).map(([k, m]) => `<button type="button" data-dm="${k}" aria-pressed="${ui.dMetric === k}">${m.label}</button>`).join('')}</div></div>
      <div class="chart" id="dChart"></div>
      <p class="muted small" style="margin:8px 0 0">${stats.length < 2 ? '성과를 여러 날 기록할수록 초반에 뜨는 콘텐츠인지, 늦게 떡상하는 콘텐츠인지 보여요.' : growthNote(c)}</p></div>
    <div class="card"><div class="card-h"><h2>유입 경로</h2></div>
      ${sum(tr, x => x.value) ? donutHTML(tr, compact(sum(tr, x => x.value)), '조회수') : `<div class="empty small">${c.ytId ? '아직 유입 데이터가 없어요' : '수정에서 유입 경로를 입력할 수 있어요'}</div>`}
      ${c.keywords.length ? `<h3 style="font-size:13px;margin:18px 0 6px">검색어</h3><ol class="kw">${c.keywords.slice().sort((a, b) => b.views - a.views).map((k, i) => `<li><button type="button" data-kw="${esc(k.keyword)}"><span class="rk">${i + 1}</span><span class="kn">${esc(k.keyword)}</span><span class="kv">${fmt(k.views)}</span></button></li>`).join('')}</ol>` : ''}
    </div>
  </div>
  <div class="grid g-11">
    <div class="card"><div class="card-h"><h2>제작 전 — 기획</h2><span class="sp"></span><button class="btn sm" data-act="edit" data-id="${esc(c.id)}" data-step="4">✏️ 기록하기</button></div><dl class="qa">
      ${qa('왜 이 콘텐츠를 만들었나?', L.reason)}${qa('누가 볼 것이라고 생각했나?', L.target)}${qa('첫 3초에 어떤 장치를 넣었나?', L.hook)}${qa('어떤 반응을 기대했나?', L.expected)}
      ${L.format || L.tools || L.hours || L.planDate ? qa('제작 정보', [L.format && '포맷: ' + L.format, L.planDate && '기획 ' + L.planDate, L.shootDate && '촬영 ' + L.shootDate, L.editDate && '편집 ' + L.editDate, L.hours && '소요 ' + L.hours + '시간', L.tools && '프로그램: ' + L.tools].filter(Boolean).join('\n')) : ''}
    </dl></div>
    <div class="card"><div class="card-h"><h2>업로드 후 — 회고</h2><span class="sp"></span><button class="btn sm" data-act="edit" data-id="${esc(c.id)}" data-step="4" data-focus="good">✏️ 기록하기</button></div><dl class="qa">
      ${qa('잘된 점', L.good)}${qa('아쉬운 점', L.bad)}${qa('댓글 반응 / 발견한 인사이트', L.reaction)}${qa('다음에 바꿀 점', L.change)}${qa('다음 콘텐츠 아이디어', L.nextIdea)}
    </dl></div>
  </div>
  <div class="card"><div class="card-h"><h2>성과 기록 히스토리</h2><span class="sub">날짜별 누적값 · 기록이 쌓여야 성장 곡선이 보존돼요</span></div>
    ${stats.length ? `<div class="tbl-wrap" style="max-height:420px;overflow-y:auto"><table class="tbl"><thead><tr><th>기록일</th><th>업로드 후</th><th class="num">조회수</th><th class="num">좋아요</th><th class="num">댓글</th><th class="num">구독자</th><th></th></tr></thead><tbody>
      ${stats.map(s => `<tr><td>${ymd(dn(s.date))}</td><td>D+${dn(s.date) - up}</td><td class="num">${fmt(s.views)}</td><td class="num">${fmt(s.likes)}</td><td class="num">${fmt(s.comments)}</td><td class="num">${signed(+s.subs || 0)}</td>
        <td class="num">${c.ytId ? '' : `<button class="btn ghost sm danger" data-act="del-stat" data-id="${esc(c.id)}" data-date="${esc(s.date)}" aria-label="${esc(s.date)} 기록 삭제">삭제</button>`}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty small">아직 성과 기록이 없어요</div>`}</div>`;
}
function growthNote(c) {
  const up = dn(c.uploadDate), T = total(c).views; const age = dn(latest(c).date) - up;
  if (!T || age < 7) return '업로드 7일 이후 기록이 있으면 성장 유형을 알려드려요.';
  const d3 = cumAt(c, 'views', up + 3) / T;
  if (d3 >= 0.6) return `업로드 3일 만에 누적 조회수의 ${(d3 * 100).toFixed(0)}%가 나왔어요 — ⚡ 초반 반응형 콘텐츠예요.`;
  if (d3 <= 0.3) return `3일까지는 누적의 ${(d3 * 100).toFixed(0)}%뿐이었어요 — 🌱 늦게 떡상하는(롱테일) 콘텐츠예요.`;
  return `3일 동안 누적 조회수의 ${(d3 * 100).toFixed(0)}%가 나왔어요 — 꾸준히 성장하는 콘텐츠예요.`;
}
function afterDetail(id) {
  const c = DB.contents.find(x => x.id === id); if (!c) return;
  $$('[data-dm]').forEach(b => b.addEventListener('click', () => { ui.dMetric = b.dataset.dm; render(); }));
  const up = dn(c.uploadDate);
  const snaps = c.stats.slice().sort((a, b) => dn(a.date) - dn(b.date)).filter(s => dn(s.date) >= up);
  const pts = (snaps.length && dn(snaps[0].date) === up ? [] : [{ date: c.uploadDate, views: 0, likes: 0, comments: 0, subs: 0 }]).concat(snaps);
  const m = METRICS[ui.dMetric];
  lineChart($('#dChart'), {
    x: pts.map(s => `D+${dn(s.date) - up}`), series: [{ label: m.label, color: m.color, values: pts.map(s => +s[ui.dMetric] || 0) }], height: 380, dots: true, aria: m.label + ' 성장',
    tip: i => ({ t: `${kday(dn(pts[i].date))} (D+${dn(pts[i].date) - up})`, rows: Object.entries(METRICS).map(([k, mm]) => ({ label: mm.label, value: fmt(pts[i][k]), color: mm.color })) }),
  });
}

/* =========================================================
   페이지: 구독자
   ========================================================= */
function pageSubscribers() {
  const R = range();
  const now = currentSubs();
  const a = subsAt(R.s - 1), b = subsAt(R.e);
  const net = a != null && b != null ? Math.round(b - a) : null;
  const PT = periodTotals(R.s, R.e);
  const gained = Math.round(PT.subs);
  const exact = PT.lost != null;
  const lost = exact ? PT.lost : net != null ? Math.max(0, gained - net) : null;
  const contrib = DB.contents.map(c => ({ c, v: inRange(c, R.s, R.e).subs, views: inRange(c, R.s, R.e).views })).filter(x => x.v > 0).sort((x, y) => y.v - x.v);
  const hist = DB.subscriberHistory.slice().sort((x, y) => dn(y.date) - dn(x.date));
  return `
  <div class="topbar"><div class="grow"><h1>👥 구독자</h1><p>구독자를 만들어내는 콘텐츠를 찾아요.</p></div><div class="top-actions">${addBtn()}</div></div>
  ${sampleBanner()}
  <div class="filters" style="margin-bottom:16px">${periodControls()}<span class="muted small">${ymd(R.s)} ~ ${ymd(R.e)}</span></div>
  <div class="grid g-kpi">
    <div class="card kpi"><span class="val">${now != null ? fmt(now) : '—'}</span><span class="lbl"><span class="dot" style="background:var(--subs)"></span>현재 구독자</span></div>
    <div class="card kpi"><span class="val">${signed(gained)}</span><span class="lbl">${exact ? '새로 구독' : '콘텐츠로 얻은 구독자'}</span><div class="delta">${exact ? 'YouTube 분석 기준' : '각 콘텐츠 기록의 합'}</div></div>
    <div class="card kpi"><span class="val">${lost != null ? (lost ? '−' + fmt(lost) : '0') : '—'}</span><span class="lbl">${exact ? '구독 취소' : '추정 이탈'}</span><div class="delta">${exact ? 'YouTube 분석 기준' : '얻은 구독자 − 순증'}</div></div>
    <div class="card kpi"><span class="val">${net != null ? signed(net) : '—'}</span><span class="lbl">순증</span><div class="delta">채널 구독자 기록 기준</div></div>
  </div>
  <div class="grid g-21">
    <div class="card"><div class="card-h"><h2>구독자 변화</h2><span class="sub">${R.len > 120 ? '주 단위' : '일 단위'}</span></div><div class="chart" id="subsChart"></div></div>
    <div class="card"><div class="card-h"><h2>구독자 수 기록</h2></div>
      ${DB.yt ? `<p class="muted small" style="margin:0 0 8px">YouTube 분석의 일별 구독/구독 취소로 자동 계산돼요. 분석 데이터는 보통 2~3일 늦게 반영돼요.${DB.yt.publicSubs != null ? ` (채널 페이지 공개 구독자 수: ${fmt(DB.yt.publicSubs)}명, 1,000명 이상은 반올림 표시)` : ''}</p>` : ''}
      <form id="subForm" ${DB.yt ? 'hidden' : ''} class="row2" style="align-items:end;margin-bottom:12px">
        <div class="fld" style="margin:0"><label for="sfD">날짜</label><input class="inp" type="date" id="sfD" value="${ds(todayN())}" required></div>
        <div class="fld" style="margin:0"><label for="sfC">구독자 수</label><input class="inp" type="number" min="0" id="sfC" placeholder="${now != null ? now : '예: 2571'}" required></div>
        <button class="btn primary" type="submit" style="grid-column:1/-1;justify-content:center">기록하기</button>
      </form>
      <p class="muted small" style="margin:0 0 8px">YouTube 스튜디오의 구독자 수를 가끔 적어두면 변화 그래프가 그려져요.</p>
      <div style="max-height:260px;overflow:auto"><table class="tbl"><tbody>
        ${hist.map(h => `<tr><td>${ymd(dn(h.date))}</td><td class="num"><b>${fmt(h.count)}</b>명</td><td class="num"><button class="btn ghost sm danger" data-act="del-sub" data-date="${esc(h.date)}" aria-label="${esc(h.date)} 기록 삭제">삭제</button></td></tr>`).join('') || '<tr><td class="muted">기록 없음</td></tr>'}

    ${contrib.length ? barsHTML(contrib.map(x => ({ label: x.c.title, value: Math.round(x.v), more: [{ label: '조회수', value: fmt(x.views) }, { label: '1천회당 구독', value: (x.v / (x.views || 1) * 1000).toFixed(1) + '명' }] })), 'var(--subs)', v => signed(v), '구독자') : `<div class="empty small">이 기간에 구독자 증가가 기록된 콘텐츠가 없어요</div>`}
  </div>`;
}
function afterSubscribers() {
  bindPeriod();
  subsChart($('#subsChart'), range(), 380);
  if (!DB.yt) $('#subForm').addEventListener('submit', e => {
    e.preventDefault();
    const date = $('#sfD').value, count = +$('#sfC').value;
    if (!date || !(count >= 0)) return;
    DB.subscriberHistory = DB.subscriberHistory.filter(h => h.date !== date).concat({ date, count });

/* =========================================================
   페이지: 유입 분석
   ========================================================= */
function pageTraffic() {
  const R = range();
  const agg = aggTraffic(R);
  const tot = sum(agg, x => x.value);
  const hasMin = agg.some(a => a.minutes > 0);
  const kws = aggKeywords(R);
  const bySource = SOURCES.map(s => {
    const best = DB.contents.map(c => { const T = total(c).views; const r = T ? inRange(c, R.s, R.e).views / T : 0; return { c, v: (+c.traffic[s] || 0) * r }; }).sort((a, b) => b.v - a.v)[0];
    return best && best.v > 0 ? best : null;
  });
  return `
  <div class="topbar"><div class="grow"><h1>🔎 유입 분석</h1><p>시청자가 어디서 은지 채널을 발견하는지 살펴봐요.</p></div><div class="top-actions">${addBtn()}</div></div>
  ${sampleBanner()}

function pageLog() {
  const hasLog = c => ['good', 'bad', 'change', 'nextIdea', 'reaction'].some(k => c.log && c.log[k]);
  const list = DB.contents.slice().sort((a, b) => dn(b.uploadDate) - dn(a.uploadDate)).filter(c => ui.logFilter === 'all' || (ui.logFilter === 'todo' ? !hasLog(c) : hasLog(c)));
  const todo = DB.contents.filter(c => !hasLog(c)).length;
  const ideas = DB.contents.filter(c => c.log && c.log.nextIdea).sort((a, b) => dn(b.uploadDate) - dn(a.uploadDate));
  const cell = (l, v) => v ? `<div><span>${l}</span><p>${esc(v)}</p></div>` : '';
  return `
  <div class="topbar"><div class="grow"><h1>📝 콘텐츠 로그</h1><p>숫자 뒤에 있는 제작 과정과 회고를 모아 봐요.</p></div><div class="top-actions">${addBtn()}</div></div>
  ${sampleBanner()}
  <div class="grid g-21">
    <div class="card">
      <div class="card-h"><h2>회고 타임라인</h2><span class="sp"></span>
        <div class="seg" role="group" aria-label="필터">${[['all', '전체'], ['done', '회고 작성'], ['todo', `회고 미작성 ${todo}`]].map(([k, l]) => `<button type="button" data-lf="${k}" aria-pressed="${ui.logFilter === k}">${l}</button>`).join('')}</div></div>
      ${list.length ? list.map(c => { const L = c.log || {}; const t = total(c); return `<div class="log-item">
        <div>${thumbHTML(c, 'md')}<div class="muted small" style="margin-top:6px">${ymd(dn(c.uploadDate))}</div></div>
        <div><h3><a href="#/content/${esc(c.id)}">${esc(c.title)}</a></h3>
          <div class="muted small">${fmtBadge(c)} ${esc(c.type || '')} · 👁 ${compact(t.views)} · ♡ ${compact(t.likes)} · 💬 ${compact(t.comments)} · 👤 ${signed(t.subs)}</div>
          ${hasLog(c) || L.reason ? `<div class="log-cols">${cell('만든 이유', L.reason)}${cell('후킹', L.hook)}${cell('잘된 점', L.good)}${cell('아쉬운 점', L.bad)}${cell('댓글 반응', L.reaction)}${cell('다음에 바꿀 점', L.change)}${cell('다음 아이디어', L.nextIdea)}</div>`
            : `<p class="muted" style="margin:10px 0 0">아직 회고가 없어요. <button class="btn sm" data-act="edit" data-id="${esc(c.id)}" data-step="4">회고 쓰기</button></p>`}
        </div></div>`; }).join('') : `<div class="empty small">해당하는 콘텐츠가 없어요</div>`}
    </div>
    <div class="card" style="align-self:start"><div class="card-h"><h2>💭 다음 콘텐츠 아이디어</h2></div>
      ${ideas.length ? `<div class="insights">${ideas.map(c => `<div class="insight"><p>${esc(c.log.nextIdea)}<br><a class="muted small" href="#/content/${esc(c.id)}">← ${esc(c.title)}</a></p></div>`).join('')}</div>` : `<div class="empty small">회고에 적은 "다음 콘텐츠 아이디어"가 여기 모여요</div>`}</div>
  </div>`;
}

function afterSettings() {
  $('#cidForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#cidIn').value.trim();
    if (v && !/\.apps\.googleusercontent\.com$/.test(v)) { toast('클라이언트 ID는 ….apps.googleusercontent.com 으로 끝나요'); return; }
    try { localStorage.setItem(KEY + ':clientId', v); } catch (err) {}
    if (v) loadGIS().catch(() => {});
    toast(v ? '클라이언트 ID를 저장했어요' : '클라이언트 ID를 지웠어요'); render();
  });
  $('#chForm').addEventListener('submit', e => {
    e.preventDefault();
    DB.channel.name = $('#chN').value.trim() || '그냥 은지';
    DB.channel.owner = $('#chO').value.trim() || '은지';
    DB.channel.url = $('#chU').value.trim();
    const th = ($('input[name="theme"]:checked') || {}).value || 'auto';
    try { localStorage.setItem(KEY + ':theme', th); } catch (err) {}
    applyTheme(); save(); toast('저장했어요'); render();
  });
  $('#importF').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || !Array.isArray(d.contents)) throw new Error('형식 오류');
        if (!confirm(`백업 파일의 콘텐츠 ${d.contents.length}개로 지금 데이터를 바꿀까요?`)) return;
        DB = normalize(d); _pc.clear(); save(); toast('불러왔어요'); render();
      } catch (err) { console.error(err); toast('올바른 백업 파일이 아니에요'); }
    };
    rd.readAsText(f);
  });
}

function openWizard(id, step = 0) {
  const c = id ? DB.contents.find(x => x.id === id) : null;

  const lt = c ? latest(c) : null;
  wiz = {
    id: c ? c.id : null, yt: !!(c && c.ytId), step,
    f: c ? { title: c.title, url: c.url, thumbnail: c.thumbnail, uploadDate: c.uploadDate, uploadTime: c.uploadTime || '', series: c.series || '', description: c.description || '', format: c.format, type: c.type, tags: c.tags.slice(),

      origStatDate: lt && c.stats.length ? lt.date : null,
      traffic: Object.assign({}, c.traffic), keywords: c.keywords.map(k => ({ ...k })), log: L }
      : { title: '', url: '', thumbnail: '', uploadDate: ds(todayN()), uploadTime: '', series: '', description: '', format: 'Shorts', type: '기타', tags: [], statDate: ds(todayN()), views: '', likes: '', comments: '', subs: '', origStatDate: null, traffic: {}, keywords: [], log: {} },
  };
  drawWizard();
}
function wizBody() {

  switch (wiz.step) {
    case 0: return `${inp('title', '콘텐츠 제목 *', 'required placeholder="예: 사쿠야 not in reality"')}

      <div class="row2">${inp('series', '시리즈', 'placeholder="예: 사쿠야 스토리"')}${inp('thumbnail', '썸네일 이미지 URL', 'placeholder="비워두면 자동"')}</div>`;
    case 1: return `<div class="fld"><span class="l">형식</span><div class="radios">${FORMATS.map(x => `<label><input type="radio" name="w_format" value="${x}" ${f.format === x ? 'checked' : ''}>${x}</label>`).join('')}</div></div>

      return `<div class="fld"><label for="w_tag">태그</label>
        <div style="display:flex;gap:8px"><input class="inp" id="w_tag" placeholder="예: 사쿠야 (Enter로 추가)"><button type="button" class="btn" data-w="addtag">＋ 추가</button></div>
